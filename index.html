<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f2e9" />
    <meta name="description" content="南京王俊凯旅行清单，支持勾选、进度统计和本机自动保存。" />
    <link rel="icon" type="image/png" href="./logo.png?v=2" />
    <link rel="apple-touch-icon" href="./logo.png?v=2" />
    <title>南京王俊凯旅行 · Todo</title>
    <style>
      :root {
        --paper: #f7f2e9;
        --card: #fffdfa;
        --ink: #203b52;
        --muted: #6e7e88;
        --line: #e8e0d3;
        --blue: #6d9caf;
        --blue-deep: #2f6e8f;
        --orange: #d8784f;
        --orange-soft: #f7e1d6;
        --yellow: #f1c56d;
        --shadow: 0 14px 28px rgba(37, 57, 68, 0.09);
        --radius-xl: 28px;
        --radius-lg: 20px;
      }

      * { box-sizing: border-box; }

      html { scroll-behavior: smooth; }

      body {
        margin: 0;
        min-width: 320px;
        color: var(--ink);
        background:
          radial-gradient(circle at 12% 2%, rgba(109, 156, 175, 0.12) 0 1px, transparent 1.5px),
          radial-gradient(circle at 82% 11%, rgba(216, 120, 79, 0.1) 0 1px, transparent 1.5px),
          linear-gradient(135deg, rgba(255,255,255,0.45), transparent 46%),
          var(--paper);
        background-size: 22px 22px, 29px 29px, auto, auto;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      button, input { font: inherit; }
      button { -webkit-tap-highlight-color: transparent; }

      .app-shell {
        width: min(100%, 860px);
        margin: 0 auto;
        padding: max(24px, env(safe-area-inset-top)) 18px calc(118px + env(safe-area-inset-bottom));
      }

      .page-header {
        position: relative;
        padding: 14px 4px 20px;
      }

      .header-copy { position: relative; z-index: 1; max-width: 620px; padding-right: 92px; }

      .micro-label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--orange);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .micro-label::before {
        content: "";
        width: 22px;
        height: 2px;
        border-radius: 2px;
        background: var(--orange);
      }

      h1 {
        margin: 11px 0 8px;
        font-size: clamp(32px, 8vw, 54px);
        line-height: 1.08;
        letter-spacing: -0.055em;
        font-weight: 800;
      }

      .header-subtitle {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.6;
      }

      .brand-logo {
        position: absolute;
        right: 0;
        top: 2px;
        width: 84px;
        height: 84px;
        object-fit: cover;
        border: 4px solid rgba(255, 253, 250, 0.92);
        border-radius: 22px;
        background: var(--card);
        box-shadow: 0 10px 20px rgba(37, 57, 68, 0.12);
      }

      .progress-panel {
        display: grid;
        grid-template-columns: 100px 1fr 1fr;
        gap: 16px;
        align-items: center;
        padding: 18px;
        margin: 2px 0 18px;
        border: 1px solid rgba(255,255,255,0.8);
        border-radius: var(--radius-xl);
        background: rgba(255, 253, 250, 0.82);
        box-shadow: var(--shadow);
        backdrop-filter: blur(8px);
      }

      .progress-ring {
        --progress: 0%;
        display: grid;
        place-items: center;
        width: 92px;
        height: 92px;
        border-radius: 50%;
        background: conic-gradient(var(--orange) var(--progress), var(--blue) var(--progress) 74%, #e6e4de 74% 100%);
        position: relative;
      }

      .progress-ring::after {
        content: "";
        position: absolute;
        inset: 8px;
        border-radius: 50%;
        background: var(--card);
      }

      .progress-ring strong {
        position: relative;
        z-index: 1;
        font-size: 23px;
        letter-spacing: -0.05em;
      }

      .progress-ring small {
        position: absolute;
        z-index: 1;
        top: 52px;
        color: var(--muted);
        font-size: 10px;
      }

      .stat {
        min-width: 0;
        padding-left: 4px;
      }

      .stat + .stat {
        padding-left: 16px;
        border-left: 1px solid var(--line);
      }

      .stat-label {
        display: block;
        margin-bottom: 3px;
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }

      .stat-value {
        display: block;
        color: var(--ink);
        font-size: clamp(20px, 5vw, 28px);
        font-weight: 800;
        letter-spacing: -0.04em;
      }

      .stat-note {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
      }

      .quick-add {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        padding: 12px;
        margin-bottom: 18px;
        border: 1px dashed rgba(47, 110, 143, 0.35);
        border-radius: var(--radius-lg);
        background: rgba(255, 253, 250, 0.54);
      }

      .quick-add input {
        width: 100%;
        min-height: 44px;
        padding: 0 14px;
        border: 1px solid transparent;
        border-radius: 13px;
        outline: none;
        color: var(--ink);
        background: rgba(255,255,255,0.78);
        transition: border-color 160ms ease, box-shadow 160ms ease;
      }

      .quick-add input::placeholder { color: #9a9f9e; }
      .quick-add input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(109, 156, 175, 0.14); }

      .primary-button,
      .secondary-button {
        min-height: 44px;
        padding: 0 16px;
        border-radius: 13px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 700;
        transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
      }

      .primary-button {
        border: 1px solid var(--orange);
        color: white;
        background: var(--orange);
        box-shadow: 0 7px 15px rgba(216, 120, 79, 0.2);
      }

      .secondary-button {
        border: 1px solid rgba(47, 110, 143, 0.55);
        color: var(--blue-deep);
        background: rgba(255,255,255,0.82);
      }

      .primary-button:active,
      .secondary-button:active { transform: translateY(1px) scale(0.99); }
      .primary-button:focus-visible,
      .secondary-button:focus-visible { outline: 3px solid rgba(109, 156, 175, 0.35); outline-offset: 2px; }

      .sections-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .category-card {
        --accent: var(--blue);
        position: relative;
        overflow: hidden;
        padding: 17px 16px 10px;
        border: 1px solid rgba(255,255,255,0.88);
        border-radius: var(--radius-xl);
        background: rgba(255, 253, 250, 0.9);
        box-shadow: var(--shadow);
      }

      .category-card::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 6px;
        background: var(--accent);
      }

      .category-card.orange { --accent: var(--orange); }

      .section-head {
        display: grid;
        grid-template-columns: 40px 1fr auto;
        gap: 11px;
        align-items: center;
        padding: 0 2px 12px 5px;
        border-bottom: 1px solid var(--line);
      }

      .section-icon {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        border-radius: 13px;
        color: white;
        background: var(--accent);
      }

      .section-icon svg { width: 21px; height: 21px; }

      .section-title {
        margin: 0;
        font-size: 18px;
        line-height: 1.2;
        letter-spacing: -0.02em;
      }

      .section-number {
        align-self: start;
        min-width: 31px;
        padding: 4px 8px;
        border-radius: 99px;
        color: white;
        background: var(--accent);
        font-size: 11px;
        font-weight: 700;
        text-align: center;
      }

      .section-count {
        grid-column: 2 / 4;
        margin-top: -7px;
        color: var(--muted);
        font-size: 11px;
      }

      .checklist { list-style: none; padding: 0; margin: 5px 0 0; }

      .todo-row {
        min-height: 49px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 5px;
        border-bottom: 1px solid rgba(232, 224, 211, 0.72);
        cursor: pointer;
        user-select: none;
        transition: background 160ms ease, opacity 160ms ease;
      }

      .todo-row:last-child { border-bottom: 0; }
      .todo-row:active { border-radius: 10px; background: rgba(109, 156, 175, 0.08); }

      .todo-item {
        display: flex;
        align-items: stretch;
        min-width: 0;
      }

      .todo-item .todo-row { flex: 1; min-width: 0; }

      .delete-item {
        flex: 0 0 auto;
        align-self: center;
        width: 32px;
        height: 32px;
        margin: 0 2px 0 4px;
        padding: 0;
        border: 0;
        border-radius: 10px;
        color: #a3aaa7;
        background: transparent;
        cursor: pointer;
        transition: color 160ms ease, background 160ms ease, transform 160ms ease;
      }

      .delete-item svg { width: 16px; height: 16px; }
      .delete-item:hover,
      .delete-item:focus-visible { color: var(--orange); background: rgba(216, 120, 79, 0.12); }
      .delete-item:active { transform: scale(0.92); }
      .delete-item:focus-visible { outline: 3px solid rgba(216, 120, 79, 0.25); outline-offset: 2px; }

      .todo-row input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }

      .checkmark {
        position: relative;
        flex: 0 0 auto;
        width: 23px;
        height: 23px;
        border: 2px solid var(--accent);
        border-radius: 7px;
        background: white;
        transition: background 160ms ease, transform 160ms ease;
      }

      .checkmark::after {
        content: "";
        position: absolute;
        left: 6px;
        top: 2px;
        width: 6px;
        height: 11px;
        border-right: 2px solid white;
        border-bottom: 2px solid white;
        transform: rotate(43deg) scale(0);
        transform-origin: center;
        transition: transform 160ms ease;
      }

      .todo-row input:checked + .checkmark { background: var(--accent); transform: scale(1.04); }
      .todo-row input:checked + .checkmark::after { transform: rotate(43deg) scale(1); }
      .todo-row input:focus-visible + .checkmark { outline: 3px solid rgba(109, 156, 175, 0.3); outline-offset: 2px; }

      .todo-name {
        min-width: 0;
        flex: 1;
        color: var(--ink);
        font-size: 15px;
        line-height: 1.45;
      }

      .todo-meta {
        flex: 0 0 auto;
        max-width: 36%;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
        text-align: right;
      }

      .todo-row input:checked ~ .todo-name,
      .todo-row input:checked ~ .todo-meta { color: #9ca4a4; text-decoration: line-through; text-decoration-thickness: 1.5px; }

      .custom-card { margin-top: 14px; }
      .custom-card .empty-note { margin: 11px 5px 6px; color: var(--muted); font-size: 12px; }

      .bottom-bar {
        position: fixed;
        z-index: 10;
        left: 50%;
        bottom: 0;
        width: min(100%, 860px);
        padding: 10px 18px calc(10px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        border-top: 1px solid rgba(232, 224, 211, 0.95);
        background: rgba(247, 242, 233, 0.94);
        box-shadow: 0 -8px 20px rgba(37, 57, 68, 0.05);
        backdrop-filter: blur(12px);
      }

      .bottom-inner {
        display: flex;
        align-items: center;
        gap: 12px;
        max-width: 824px;
        margin: 0 auto;
      }

      .bottom-progress {
        flex: 1;
        min-width: 0;
      }

      .bottom-progress strong { display: block; font-size: 14px; }
      .bottom-progress span { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }

      .reset-button { white-space: nowrap; }

      .toast {
        position: fixed;
        z-index: 20;
        left: 50%;
        bottom: calc(78px + env(safe-area-inset-bottom));
        max-width: calc(100% - 40px);
        padding: 10px 15px;
        border-radius: 99px;
        color: white;
        background: var(--ink);
        box-shadow: var(--shadow);
        font-size: 13px;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, 10px);
        transition: opacity 180ms ease, transform 180ms ease;
      }

      .toast.show { opacity: 1; transform: translate(-50%, 0); }

      @media (min-width: 720px) {
        .app-shell { padding-left: 28px; padding-right: 28px; }
        .page-header { padding-top: 22px; }
        .progress-panel { padding: 22px 26px; }
        .sections-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
        .bottom-bar { padding-left: 28px; padding-right: 28px; }
      }

      @media (max-width: 430px) {
        .brand-logo { width: 72px; height: 72px; border-width: 3px; border-radius: 19px; }
        .header-copy { padding-right: 78px; }
        .progress-panel { grid-template-columns: 86px 1fr 1fr; gap: 10px; padding: 14px; }
        .progress-ring { width: 80px; height: 80px; }
        .progress-ring::after { inset: 7px; }
        .progress-ring small { top: 46px; }
        .stat + .stat { padding-left: 11px; }
        .stat-note { font-size: 10px; }
        .quick-add { grid-template-columns: 1fr; }
        .quick-add .primary-button { width: 100%; }
        .bottom-inner { gap: 8px; }
        .reset-button { padding-left: 12px; padding-right: 12px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <header class="page-header">
        <div class="header-copy">
          <h1>南京王俊凯旅行</h1>
          <p class="header-subtitle">把要带的都装进行李箱，出发前逐项确认。</p>
        </div>
      <img class="brand-logo" src="./logo.png?v=2" alt="KuCha Work logo" width="84" height="84" />
      </header>

      <section class="progress-panel" aria-label="清单进度">
        <div class="progress-ring" id="progressRing" aria-hidden="true">
          <strong id="progressPercent">0%</strong>
          <small>完成度</small>
        </div>
        <div class="stat">
          <span class="stat-label">准备出发</span>
          <strong class="stat-value" id="progressFraction">0 / 48</strong>
          <span class="stat-note">已勾选事项</span>
        </div>
        <div class="stat">
          <span class="stat-label">已完成</span>
          <strong class="stat-value" id="completedValue">0</strong>
          <span class="stat-note" id="progressMessage">慢慢准备，不着急</span>
        </div>
      </section>

      <form class="quick-add" id="quickAddForm">
        <input id="quickAddInput" type="text" maxlength="40" placeholder="临时加一项，例如：买南京盐水鸭" autocomplete="off" />
        <button class="primary-button" type="submit">加入清单</button>
      </form>

      <section class="sections-grid" id="sectionsGrid" aria-label="旅行清单"></section>
      <section class="category-card orange custom-card" id="customSection" hidden></section>
    </main>

    <div class="bottom-bar">
      <div class="bottom-inner">
        <div class="bottom-progress">
          <strong id="bottomSummary">0 / 48 已完成</strong>
          <span>勾选状态会自动保存在这部手机上</span>
        </div>
        <button class="secondary-button reset-button" id="resetButton" type="button">重置勾选</button>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      const STORAGE_KEY = "nj-wjk-travel-todo-v1";

      const iconSvgs = {
        travel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5.5h6v14H9z"/><path d="M9 8H7.5A1.5 1.5 0 0 0 6 9.5v8A1.5 1.5 0 0 0 7.5 19H9M15 8h1.5A1.5 1.5 0 0 1 18 9.5v8a1.5 1.5 0 0 1-1.5 1.5H15M10 3h4M10 3v2.5M14 3v2.5"/></svg>',
        storage: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8.5h14v10H5z"/><path d="M7.5 8.5V6.7A1.7 1.7 0 0 1 9.2 5h5.6a1.7 1.7 0 0 1 1.7 1.7v1.8M8 12h8M8 15h5"/></svg>',
        electronics: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="4" width="10" height="16" rx="2"/><path d="M10 7h4M10 17h4M4 9v6M20 9v6"/></svg>',
        health: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="6" width="16" height="14" rx="2"/><path d="M9 6V4h6v2M8 13h8M12 9v8"/></svg>',
        clothes: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5-5 3 2 4 3-1v8h6v-8l3 1 2-4-5-3"/><path d="M9 5c.4 1.7 1.4 2.5 3 2.5S14.6 6.7 15 5"/></svg>',
        wash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9h12l-1 11H7L6 9Z"/><path d="M8 6c0-1.7 1.3-3 3-3h2c1.7 0 3 1.3 3 3v3H8V6Z"/><path d="M10 13h4"/></svg>',
        custom: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>'
      };

      const sections = [
        {
          id: "travel",
          title: "出行必带类",
          icon: "travel",
          accent: "blue",
          items: [
            ["身份证", "1"], ["近视眼镜", "1"], ["小雨伞", "1"], ["小风扇", "1"],
            ["冰凉贴", "∞"], ["随身小纸巾", "∞"], ["随身小镜子", "1"]
          ]
        },
        {
          id: "storage",
          title: "收纳整理类",
          icon: "storage",
          accent: "orange",
          items: [
            ["行李箱", "1"], ["演唱会手提包", "1"], ["洗漱包 + 化妆包", "1 + 1"],
            ["衣物收纳袋", "2"], ["备用密封袋", "∞"], ["垃圾袋", "∞"]
          ]
        },
        {
          id: "electronics",
          title: "电子产品类",
          icon: "electronics",
          accent: "blue",
          items: [
            ["充电宝", "1（充好电）"], ["充电头 + 数据线", "2 + 3"], ["蓝牙耳机", "1"],
            ["苹果手表 + 数据线", "1 + 1"], ["苹果8 + 苹果17pro + 苹果17promax", "充好电"], ["自拍杆 | 三脚架", "1"]
          ]
        },
        {
          id: "health",
          title: "药品健康类",
          icon: "health",
          accent: "orange",
          items: [
            ["晕机药", ""], ["膏药贴", ""], ["布洛芬", ""], ["鸡脚贴", ""], ["便利贴", ""],
            ["青草膏", ""], ["鼻吸清凉贴", ""], ["口罩", ""], ["酒精棉片", ""]
          ]
        },
        {
          id: "clothes",
          title: "衣服穿搭类",
          icon: "clothes",
          accent: "blue",
          items: [
            ["搭配衣服", "3"], ["睡衣睡裤", "1"], ["蓝色帽子", "1"], ["袜子", "3"],
            ["墨镜 + 装饰眼镜", "1 + 1"], ["一次性内裤", "4"], ["鞋子 + 拖鞋", "1 + ？"], ["项链", "2"], ["防晒衣", "？"]
          ]
        },
        {
          id: "wash",
          title: "洗漱护肤类",
          icon: "wash",
          accent: "orange",
          items: [
            ["牙膏牙刷牙杯", "1"], ["一次性床上四件套", "1"], ["一次性毛巾浴巾洗脸巾", "2"],
            ["一次性马桶垫", "3"], ["抽纸 + 湿巾", "∞"], ["便携装沐浴露洗发水洗面奶", "？"],
            ["安睡裤 + 卫生巾", "？"], ["牙线", "∞"], ["卸妆小样", "∞"], ["护肤品", "1"], ["化妆品", "1"]
          ]
        }
      ];

      let state = loadState();
      let toastTimer;

      function loadState() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
          if (saved && typeof saved === "object") {
            return { checked: saved.checked || {}, custom: Array.isArray(saved.custom) ? saved.custom : [] };
          }
        } catch (error) { /* Start clean if storage is unavailable or malformed. */ }
        return { checked: {}, custom: [] };
      }

      function saveState() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (error) { /* Private mode may block storage. */ }
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>'"]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[char]));
      }

      function getAllItems() {
        const fixed = sections.flatMap((section) => section.items.map((_, index) => `${section.id}-${index}`));
        const custom = state.custom.map((item) => item.id);
        return [...fixed, ...custom];
      }

      function renderSection(section, sectionIndex) {
        const sectionItems = section.items.map((item, index) => ({ id: `${section.id}-${index}`, name: item[0], meta: item[1] }));
        const completed = sectionItems.filter((item) => state.checked[item.id]).length;
        return `
          <article class="category-card ${section.accent === "orange" ? "orange" : ""}">
            <div class="section-head">
              <div class="section-icon">${iconSvgs[section.icon]}</div>
              <h2 class="section-title">${section.title}</h2>
              <span class="section-number">${String(sectionIndex + 1).padStart(2, "0")}</span>
              <span class="section-count">${completed} / ${sectionItems.length} 已完成</span>
            </div>
            <ul class="checklist">
              ${sectionItems.map((item) => renderTodo(item)).join("")}
            </ul>
          </article>
        `;
      }

      function renderTodo(item, canDelete = false) {
        const checked = Boolean(state.checked[item.id]);
        return `
          <li class="${canDelete ? "todo-item" : ""}">
            <label class="todo-row">
              <input type="checkbox" data-todo-id="${escapeHtml(item.id)}" ${checked ? "checked" : ""} />
              <span class="checkmark" aria-hidden="true"></span>
              <span class="todo-name">${escapeHtml(item.name)}</span>
              ${item.meta ? `<span class="todo-meta">${escapeHtml(item.meta)}</span>` : ""}
            </label>
            ${canDelete ? `<button class="delete-item" type="button" data-delete-id="${escapeHtml(item.id)}" aria-label="删除${escapeHtml(item.name)}" title="删除此项"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7l1-3h4l1 3" /></svg></button>` : ""}
          </li>
        `;
      }

      function renderCustomSection() {
        const section = document.getElementById("customSection");
        if (!state.custom.length) {
          section.hidden = true;
          section.innerHTML = "";
          return;
        }
        const completed = state.custom.filter((item) => state.checked[item.id]).length;
        section.hidden = false;
        section.innerHTML = `
          <div class="section-head">
            <div class="section-icon">${iconSvgs.custom}</div>
            <h2 class="section-title">临时事项</h2>
            <span class="section-number">＋</span>
            <span class="section-count">${completed} / ${state.custom.length} 已完成</span>
          </div>
          <ul class="checklist">${state.custom.map((item) => renderTodo(item, true)).join("")}</ul>
        `;
      }

      function render() {
        document.getElementById("sectionsGrid").innerHTML = sections.map(renderSection).join("");
        renderCustomSection();
        updateSummary();
      }

      function updateSummary() {
        const allItems = getAllItems();
        const completed = allItems.filter((id) => state.checked[id]).length;
        const total = allItems.length;
        const percent = total ? Math.round((completed / total) * 100) : 0;
        const ring = document.getElementById("progressRing");
        ring.style.setProperty("--progress", `${percent}%`);
        document.getElementById("progressPercent").textContent = `${percent}%`;
        document.getElementById("progressFraction").textContent = `${completed} / ${total}`;
        document.getElementById("completedValue").textContent = completed;
        document.getElementById("bottomSummary").textContent = `${completed} / ${total} 已完成`;
        document.getElementById("progressMessage").textContent = percent === 100 ? "可以出发啦 ✦" : percent >= 60 ? "快准备好了" : "慢慢准备，不着急";
      }

      function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
      }

      document.addEventListener("change", (event) => {
        const checkbox = event.target.closest("input[data-todo-id]");
        if (!checkbox) return;
        state.checked[checkbox.dataset.todoId] = checkbox.checked;
        saveState();
        render();
        if (checkbox.checked) showToast("已勾选，记得装进行李箱");
      });

      document.addEventListener("click", (event) => {
        const button = event.target.closest("[data-delete-id]");
        if (!button) return;
        const id = button.dataset.deleteId;
        const item = state.custom.find((customItem) => customItem.id === id);
        if (!item) return;
        if (!window.confirm(`要删除临时事项“${item.name}”吗？`)) return;
        state.custom = state.custom.filter((customItem) => customItem.id !== id);
        delete state.checked[id];
        saveState();
        render();
        showToast("已删除临时事项");
      });

      document.getElementById("quickAddForm").addEventListener("submit", (event) => {
        event.preventDefault();
        const input = document.getElementById("quickAddInput");
        const name = input.value.trim();
        if (!name) { input.focus(); return; }
        const id = `custom-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
        state.custom.push({ id, name, meta: "临时" });
        saveState();
        input.value = "";
        render();
        showToast("已加入临时事项");
      });

      document.getElementById("resetButton").addEventListener("click", () => {
        const completedCount = Object.values(state.checked).filter(Boolean).length;
        if (!completedCount) { showToast("还没有需要重置的勾选"); return; }
        if (!window.confirm("要清空所有已勾选事项吗？")) return;
        state.checked = {};
        saveState();
        render();
        showToast("已重置，可以重新开始");
      });

      render();
    </script>
  </body>
</html>
